version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: uv
    directory: /backend
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: weekly
    ignore:
      # Python 3.13 is the supported runtime; moving to a new minor version is a deliberate decision.
      - dependency-name: "python"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
