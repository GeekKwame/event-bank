# Local development only. Ports bind to 127.0.0.1 so the database is not exposed to your network.
# For a production deployment use docker-compose.prod.yml (see docs/deployment.md).
x-backend: &backend
  build:
    context: ./backend
    target: dev
    args:
      APP_UID: ${APP_UID:-1000}
      APP_GID: ${APP_GID:-1000}
  volumes:
    - ./backend:/app
  env_file:
    - path: .env
      required: false
  environment:
    DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-dev-insecure-secret-key}
    DJANGO_DEBUG: ${DJANGO_DEBUG:-true}
    DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
    POSTGRES_DB: ${POSTGRES_DB:-event_bank}
    POSTGRES_USER: ${POSTGRES_USER:-event_bank}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-event_bank}
    POSTGRES_HOST: db
    POSTGRES_PORT: "5432"
  depends_on:
    db:
      condition: service_healthy

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-event_bank}
      POSTGRES_USER: ${POSTGRES_USER:-event_bank}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-event_bank}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    <<: *backend
    command: >-
      sh -c "python manage.py migrate && python manage.py createcachetable
      && python manage.py runserver 0.0.0.0:8000"
    ports:
      - "127.0.0.1:${BACKEND_HOST_PORT:-8000}:8000"

  # Scheduling, Telegram polling and delivery. Each stays off until its .env flag is enabled,
  # so the worker is idle by default. It restarts if it exits (e.g. before migrations ran).
  worker:
    <<: *backend
    command: python manage.py run_worker
    restart: unless-stopped

volumes:
  pgdata:
