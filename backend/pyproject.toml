[project]
name = "event-bank-backend"
version = "0.1.0"
description = "Event Bank backend API"
license = "AGPL-3.0-only"
requires-python = ">=3.13,<3.15"
dependencies = [
    "Django>=5.2,<6.2",
    "djangorestframework>=3.15,<4",
    "psycopg[binary]>=3.2,<4",
    "httpx>=0.27,<1",
    "beautifulsoup4>=4.12,<5",
    "icalendar>=7,<8",
    "gunicorn>=23,<24",
    "whitenoise>=6.7,<7",
    "tzdata>=2024.1",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-django>=4.9",
    "ruff>=0.6",
    "pip-audit>=2.7",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
pythonpath = ["."]
testpaths = ["tests"]
addopts = "--strict-markers"
# Static files are only collected in the production image.
filterwarnings = ["ignore:No directory at:UserWarning"]

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["**/migrations/*.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "DJ", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S104", "S105", "S106"]
